{% extends "basepages/base.html" %}
{% load static tailwind_tags %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-gray-100 p-6">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-6 transform transition-all duration-500 hover:scale-105">
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Logout</h2>
    <p class="text-center text-gray-600 mb-6">Are you sure you want to log out?</p>

    <form method="post" class="flex flex-col items-center">
      {% csrf_token %}
      <button type="submit"
        class="w-full bg-red-500 text-white font-semibold py-2 px-4 rounded-xl hover:bg-red-600 transition duration-300">
        Logout
      </button>
    </form>
  </div>
</div>
{% if messages %}
  <div class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50">
    {% for message in messages %}
      <div class="bg-{{ message.tags }}-100 border-l-4 border-{{ message.tags }}-500 text-{{ message.tags }}-700 p-4 mb-4 rounded-lg shadow-lg transition-opacity duration-300 animate-fade-in">
        <p>{{ message }}</p>
      </div>
    {% endfor %}
  </div>
{% endif %}

{% endblock %}
