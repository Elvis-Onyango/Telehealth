<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Video Consultation</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom animations and transitions */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        
        .transition-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center min-h-screen p-4">
    <!-- Main Card Container -->
    <div class="bg-white rounded-2xl overflow-hidden card-shadow w-full max-w-md transition-smooth hover:shadow-xl animate-fade-in-up">
        <!-- Header with decorative element -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center">
            <div class="flex justify-center mb-3">
                <div class="bg-white/20 p-3 rounded-full">
                    <i class="fas fa-video text-white text-xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-white">Schedule Video Consultation</h1>
            <p class="text-blue-100 mt-2 text-sm">Connect with your patients remotely</p>
        </div>

        <!-- Form Container -->
        <div class="p-6 md:p-8">
            <!-- Video Call Creation Form -->
            <form id="create-meeting-form" class="space-y-5">
                <!-- Scheduled Time -->
                <div class="space-y-1">
                    <label for="scheduled_time" class="block text-sm font-medium text-gray-700 flex items-center">
                        <i class="far fa-calendar-alt text-blue-500 mr-2"></i>
                        Consultation Time
                    </label>
                    <div class="relative">
                        <input 
                            type="datetime-local" 
                            id="scheduled_time" 
                            name="scheduled_time" 
                            class="w-full px-4 py-3 pl-10 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-smooth"
                            required>
                        <i class="fas fa-clock absolute left-3 top-3.5 text-gray-400"></i>
                    </div>
                </div>

                <!-- Duration -->
                <div class="space-y-1">
                    <label for="duration" class="block text-sm font-medium text-gray-700 flex items-center">
                        <i class="far fa-clock text-blue-500 mr-2"></i>
                        Duration (minutes)
                    </label>
                    <div class="relative">
                        <input 
                            type="number" 
                            id="duration" 
                            name="duration" 
                            min="15" 
                            max="120" 
                            class="w-full px-4 py-3 pl-10 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-smooth"
                            required>
                        <i class="fas fa-hourglass-half absolute left-3 top-3.5 text-gray-400"></i>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Minimum 15 minutes, maximum 2 hours</p>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="w-full flex justify-center items-center py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-smooth shadow-md">
                        <span id="btn-text">Schedule Consultation</span>
                        <span id="spinner" class="ml-2 hidden">
                            <i class="fas fa-spinner fa-spin"></i>
                        </span>
                    </button>
                </div>
            </form>

            <!-- Success/Error Message Container -->
            <div id="message" class="mt-6 hidden transition-smooth">
                <div class="rounded-lg p-4 border" id="message-content">
                    <!-- Content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('create-meeting-form');
            const messageContainer = document.getElementById('message');
            const messageContent = document.getElementById('message-content');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Show loading state
                submitBtn.disabled = true;
                btnText.textContent = 'Creating...';
                spinner.classList.remove('hidden');
                messageContainer.classList.add('hidden');

                const formData = new FormData(form);
                const data = {
                    scheduled_time: formData.get('scheduled_time'),
                    duration: parseInt(formData.get('duration')),
                };
                const baseUrl = window.location.origin;

                try {
                    const response = await fetch(`${baseUrl}/api/videoconferencing/create-calls/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCSRFToken()
                        },
                        body: JSON.stringify(data),
                    });

                    const result = await response.json();

                    // Show message container
                    messageContainer.classList.remove('hidden');
                    messageContainer.classList.add('animate-fade-in-up');

                    if (response.ok) {
                        // Success message
                        messageContent.innerHTML = `
                            <div class="bg-green-50 border-green-200 text-green-700 rounded-lg p-4">
                                <div class="flex items-center">
                                    <i class="fas fa-check-circle text-green-500 mr-2"></i>
                                    <h3 class="font-semibold">Consultation Scheduled!</h3>
                                </div>
                                <p class="mt-2 text-sm">Your video consultation has been successfully scheduled.</p>
                                <div class="mt-3 bg-white p-3 rounded border border-green-100">
                                    <p class="text-sm font-medium">Meeting Link:</p>
                                    <a href="${result.meeting_link}" target="_blank" class="text-blue-600 hover:underline break-all">${result.meeting_link}</a>
                                </div>
                                <div class="mt-3 flex space-x-2">
                                    <button onclick="copyToClipboard('${result.meeting_link}')" class="flex-1 bg-green-100 text-green-700 px-3 py-2 rounded text-sm hover:bg-green-200 transition-smooth">
                                        <i class="far fa-copy mr-1"></i> Copy Link
                                    </button>
                                    <a href="${result.meeting_link}" target="_blank" class="flex-1 bg-blue-100 text-blue-700 px-3 py-2 rounded text-sm hover:bg-blue-200 transition-smooth text-center">
                                        <i class="fas fa-external-link-alt mr-1"></i> Open
                                    </a>
                                </div>
                            </div>
                        `;
                    } else {
                        // Error message
                        messageContent.innerHTML = `
                            <div class="bg-red-50 border-red-200 text-red-700 rounded-lg p-4">
                                <div class="flex items-center">
                                    <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                                    <h3 class="font-semibold">${result.error || 'Error creating consultation'}</h3>
                                </div>
                                <p class="mt-2 text-sm">Please check your details and try again.</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    messageContainer.classList.remove('hidden');
                    messageContent.innerHTML = `
                        <div class="bg-red-50 border-red-200 text-red-700 rounded-lg p-4">
                            <div class="flex items-center">
                                <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                                <h3 class="font-semibold">Network Error</h3>
                            </div>
                            <p class="mt-2 text-sm">Unable to connect to server. Please try again later.</p>
                        </div>
                    `;
                } finally {
                    // Reset button state
                    submitBtn.disabled = false;
                    btnText.textContent = 'Schedule Consultation';
                    spinner.classList.add('hidden');
                }
            });

            // Set minimum datetime to current time
            const now = new Date();
            const timezoneOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(now - timezoneOffset)).toISOString().slice(0, 16);
            document.getElementById('scheduled_time').min = localISOTime;
        });

        function getCSRFToken() {
            const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
            return cookie ? cookie.split('=')[1] : '';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Show temporary feedback
                const copyBtn = document.querySelector('[onclick="copyToClipboard(\'' + text + '\')"]');
                if (copyBtn) {
                    const originalHtml = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check mr-1"></i> Copied!';
                    copyBtn.classList.add('bg-green-100', 'text-green-700');
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHtml;
                        copyBtn.classList.remove('bg-green-100', 'text-green-700');
                    }, 2000);
                }
            }).catch(() => {
                alert('Failed to copy link. Please try again.');
            });
        }
    </script>
</body>
</html>
