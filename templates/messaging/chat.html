{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor/Patient Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow p-4 flex justify-between">
    <h1 class="text-xl font-bold text-gray-800">🩺 Secure Messaging</h1>
    <p class="text-sm text-gray-600">Logged in as: <strong>{{ username }}</strong> ({{ role }})</p>
  </nav>

  <!-- Main Layout -->
  <div class="flex h-[90vh]">

    <!-- Contacts Sidebar -->
    <div class="w-1/4 bg-white border-r overflow-y-auto">
      <h2 class="text-lg font-semibold px-4 py-3 border-b">Contacts</h2>
      <ul id="contact-list" class="divide-y divide-gray-200"></ul>
    </div>

    <!-- Chat Area -->
    <div class="w-3/4 flex flex-col">
      
      <!-- Chat Header -->
      <div class="bg-white border-b px-4 py-3">
        <h2 id="chat-header" class="text-lg font-semibold text-gray-700">Select a contact</h2>
      </div>

      <!-- Chat Messages -->
      <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-gray-50 space-y-2">
        <!-- Messages will go here -->
      </div>

      <!-- Send Message Form -->
      <form id="chat-form" class="flex items-center border-t p-4 bg-white">
        <input type="text" id="chat-input" class="flex-1 border rounded px-4 py-2 mr-2" placeholder="Type your message..." required>
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">Send</button>
      </form>

    </div>
  </div>

  <!-- Inject context from Django -->
  <script>
    const userId = "{{ user_id }}";
    const username = "{{ username }}";
    const role = "{{ role }}";
    const token = localStorage.getItem("access_token");
    let selectedContact = null;
  </script>

  <!-- Chat Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadContacts();

      document.getElementById("chat-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const content = document.getElementById("chat-input").value.trim();
        if (!content || !selectedContact) return;

        await fetch("/api/messaging/messages/send/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            recipient: selectedContact,
            content: content,
            message_type: "text"
          })
        });

        document.getElementById("chat-input").value = "";
        loadMessages(selectedContact);
      });
    });

    async function loadContacts() {
      let contacts = [];

      try {
        if (role === "doctor") {
          const res = await fetch("/api/users/doctor/patients/", {
            headers: { "Authorization": "Bearer " + token }
          });
          const data = await res.json();
          contacts = data.results;
        } else if (role === "patient") {
          const res = await fetch("/api/users/patient/profile/", {
            headers: { "Authorization": "Bearer " + token }
          });
          const data = await res.json();
          contacts = data.doctors;
        } else {
          alert("Unknown role");
          return;
        }

        const contactList = document.getElementById("contact-list");
        contactList.innerHTML = "";

        contacts.forEach(contact => {
          const user = contact.user || {}; // fallback
          const name = user.username || `${user.first_name || ''} ${user.last_name || ''}`.trim() || "Unknown";
          const contactId = user.id;

          if (!contactId) return; // skip invalid contact

          const li = document.createElement("li");
          li.className = "p-4 hover:bg-gray-100 cursor-pointer";
          li.innerText = name;
          li.onclick = () => {
            selectedContact = contactId;
            document.getElementById("chat-header").innerText = name;
            loadMessages(contactId);
          };
          contactList.appendChild(li);
        });

      } catch (err) {
        console.error("Failed to load contacts:", err);
      }
    }

    async function loadMessages(contactId) {
  const res = await fetch(`/api/messaging/messages/${contactId}/`, {
    headers: { "Authorization": "Bearer " + token }
  });

  if (!res.ok) {
    alert("Failed to load messages");
    return;
  }

  const messages = await res.json();
  const chatBox = document.getElementById("chat-box");
  chatBox.innerHTML = "";

  messages.forEach(msg => {
    const isMe = msg.sender && msg.sender.id === parseInt(userId);
    const div = document.createElement("div");
    div.className = `max-w-[75%] p-2 px-4 rounded shadow text-sm ${
      isMe ? 'bg-blue-500 text-white self-end ml-auto' : 'bg-gray-200 text-gray-800'
    }`;
    div.innerText = msg.content;
    chatBox.appendChild(div);
  });

  chatBox.scrollTop = chatBox.scrollHeight;
}

  </script>
</body>
</html>
