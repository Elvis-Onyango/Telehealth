<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/heroicons"></script>
  <style>
    /* Hide sidebar on mobile and display hamburger */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .sidebar.open {
        display: block;
      }

      .hamburger {
        display: block;
      }
    }

    .hamburger {
      display: none;
    }
  </style>
</head>

<body class="bg-gray-100">

  <!-- Dashboard Container -->
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar bg-blue-800 text-white w-64 p-4 flex-shrink-0">
      <h1 class="text-2xl font-bold mb-6">Hospital</h1>
      <nav>
        <a href="#" class="flex items-center py-2 hover:bg-blue-700" onclick="loadContent('dashboard')">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          Dashboard
        </a>
        <a href="#" class="flex items-center py-2 hover:bg-blue-700" onclick="loadContent('patients')">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          Patients
        </a>
        <a href="#" class="flex items-center py-2 hover:bg-blue-700" onclick="loadContent('doctors')">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          Doctors
        </a>
        <a href="#" class="flex items-center py-2 hover:bg-blue-700" onclick="loadContent('medicines')">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
          Medicines
        </a>
        <a href="#" class="flex items-center py-2 hover:bg-blue-700" onclick="loadContent('appointments')">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Appointments
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Navbar -->
      <header class="bg-white shadow p-4">
        <div class="flex justify-between items-center">
          <h2 class="text-2xl font-bold">Dashboard</h2>
          <div class="flex items-center">
            <button class="hamburger text-gray-700 p-4 md:hidden" onclick="toggleSidebar()">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
            <input type="text" placeholder="Search..." class="px-4 py-2 border rounded-lg">
            <div class="ml-4 relative">
              <button class="flex items-center">
                <img src="https://via.placeholder.com/40" alt="User" class="rounded-full">
                <span class="ml-2">Admin</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content Section -->
      <main class="flex-1 overflow-y-auto p-6" id="content">

        <!-- Default Content (Dashboard) -->
        <div id="dashboard">
          <h3 class="text-xl font-bold">Dashboard Overview</h3>
          <p>This is the dashboard where you can view the overview of the hospital data.</p>

          <!-- Chart.js Example -->
          <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-4 rounded-lg shadow">
              <h4 class="font-bold mb-4">Patient Admissions</h4>
              <canvas id="patientChart"></canvas>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
              <h4 class="font-bold mb-4">Doctor Appointments</h4>
              <canvas id="appointmentChart"></canvas>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
              <h4 class="font-bold mb-4">Medicine Stock</h4>
              <canvas id="medicineChart"></canvas>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
              <h4 class="font-bold mb-4">Patient Gender Distribution</h4>
              <canvas id="genderChart"></canvas>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    function loadContent(section) {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = ''; // Clear existing content

      switch (section) {
       case 'patients':
  contentDiv.innerHTML = `

            <input type="checkbox" class="select-patient" data-id="3">
          </td>
          <td class="py-2 px-4">Linda Wambui</td>
          <td class="py-2 px-4">28</td>
          <td class="py-2 px-4">Female</td>
          <td class="py-2 px-4">+254712345678</td>
          <td class="py-2 px-4">
            <div class="flex space-x-2">
              <button class="bg-blue-500 text-white py-1 px-4 rounded hover:bg-blue-600 transition-all" onclick="viewPatient(3)">View Details</button>
              <button class="bg-green-500 text-white py-1 px-4 rounded hover:bg-green-600 transition-all" onclick="sendMessage(3)">Send Message</button>
              <button class="bg-red-500 text-white py-1 px-4 rounded hover:bg-red-600 transition-all" onclick="deletePatient(3)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="mt-6">
      <h4 class="font-bold">Chat</h4>
      <textarea id="messageInput" rows="4" placeholder="Enter your message..." class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
      <button id="sendMessageBtn" class="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-all" disabled>Send</button>
    </div>

    <div class="mt-6">
      <button id="sendToSelected" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-all" disabled>Send to Selected Patients</button>
    </div>
  `;
  break;



        case 'doctors':
          contentDiv.innerHTML = `
             <div class="p-5">
  <h3 class="text-2xl font-bold mb-4">Doctors</h3>
  <h1 class="text-lg mb-4">List of doctors available</h1>
  <hr class="mb-6">
  
  <!-- Search Bar -->
  <div class="mb-4">
    <input type="text" id="searchDoctor" class="px-4 py-2 border border-gray-300 rounded-lg w-1/3" placeholder="Search Doctors by Name..." oninput="filterDoctors()">
  </div>

  <!-- Doctors Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="doctor-card p-5 border border-gray-200 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
      <div class="text-center">
        <img src="https://via.placeholder.com/150" alt="doctor" class="rounded-full mx-auto mb-4">
        <h4 class="text-xl font-semibold mb-2">Sarah Atieno</h4>
        <p class="text-gray-600">Radiologist</p>
        <p class="text-gray-400">+254 700 123456</p>
      </div>
      <div class="mt-4 flex justify-between">
        <button onclick="editDoctor('Sarah Atieno')" class="text-blue-500 hover:text-blue-700">Edit</button>
        <button onclick="deleteDoctor('Sarah Atieno')" class="text-red-500 hover:text-red-700">Delete</button>
      </div>
    </div>

    <div class="doctor-card p-5 border border-gray-200 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
      <div class="text-center">
        <img src="https://via.placeholder.com/150" alt="doctor" class="rounded-full mx-auto mb-4">
        <h4 class="text-xl font-semibold mb-2">Cynthia Jane</h4>
        <p class="text-gray-600">Surgeon</p>
        <p class="text-gray-400">+254 700 123456</p>
      </div>
      <div class="mt-4 flex justify-between">
        <button onclick="editDoctor('Cynthia Jane')" class="text-blue-500 hover:text-blue-700">Edit</button>
        <button onclick="deleteDoctor('Cynthia Jane')" class="text-red-500 hover:text-red-700">Delete</button>
      </div>
    </div>

    <div class="doctor-card p-5 border border-gray-200 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
      <div class="text-center">
        <img src="https://via.placeholder.com/150" alt="doctor" class="rounded-full mx-auto mb-4">
        <h4 class="text-xl font-semibold mb-2">Emily Asiko</h4>
        <p class="text-gray-600">Radiologist</p>
        <p class="text-gray-400">+254 700 123456</p>
      </div>

        <button onclick="editDoctor('Emily Asiko')" class="text-blue-500 hover:text-blue-700">Edit</button>

        <p class="text-gray-600">Radiologist</p>
        <p class="text-gray-400">+254 700 123456</p>
      </div>
      <div class="mt-4 flex justify-between">
        <button onclick="editDoctor('Eyleen Sang')" class="text-blue-500 hover:text-blue-700">Edit</button>
        <button onclick="deleteDoctor('Eyleen Sang')" class="text-red-500 hover:text-red-700">Delete</button>
      </div>
    </div>

    <div class="doctor-card p-5 border border-gray-200 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
      <div class="text-center">
        <img src="https://via.placeholder.com/150" alt="doctor" class="rounded-full mx-auto mb-4">
        <h4 class="text-xl font-semibold mb-2">Trevor Totona</h4>
        <p class="text-gray-600">Radiologist</p>
        <p class="text-gray-400">+254 700 123456</p>
      </div>
      <div class="mt-4 flex justify-between">
        <button onclick="editDoctor('Trevor Totona')" class="text-blue-500 hover:text-blue-700">Edit</button>
        <button onclick="deleteDoctor('Trevor Totona')" class="text-red-500 hover:text-red-700">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for Confirming Delete -->
<div id="deleteModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden">
  <div class="flex items-center justify-center h-full">
    <div class="bg-white p-8 rounded-lg w-1/3">
      <h2 class="text-xl font-bold mb-4">Are you sure you want to delete this doctor?</h2>
      <div class="flex justify-between">
        <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-300 rounded-lg">Cancel</button>

</div>

          `;
          break;
// Appointments Section
case 'appointments':
  contentDiv.innerHTML = `
    <h3 class="text-xl font-bold mb-4">Appointments</h3>
    <p>Details of upcoming appointments.</p>
    <button id="addAppointmentBtn" class="bg-blue-500 text-white py-2 px-4 rounded mt-4">Add Appointment</button>

    <table id="appointmentTable" class="min-w-full mt-4">
      <thead>
        <tr class="border-b">
          <th class="px-4 py-2">Patient Name</th>
          <th class="px-4 py-2">Doctor Name</th>
          <th class="px-4 py-2">Date</th>
          <th class="px-4 py-2">Time</th>
          <th class="px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="appointmentList">
        <!-- Appointment list will be dynamically populated here -->
      </tbody>
    </table>

    <div id="addAppointmentForm" class="hidden mt-4">
      <h3 class="text-xl font-bold mb-4">Add New Appointment</h3>
      <form id="appointmentForm">
        <div class="mb-4">
          <label class="block">Patient Name</label>
          <input type="text" id="patientName" class="p-2 border rounded w-full" placeholder="Enter patient name" required>
        </div>
        <div class="mb-4">
          <label class="block">Doctor Name</label>
          <input type="text" id="doctorName" class="p-2 border rounded w-full" placeholder="Enter doctor name" required>
        </div>
        <div class="mb-4">
          <label class="block">Date</label>
          <input type="date" id="appointmentDate" class="p-2 border rounded w-full" required>
        </div>
        <div class="mb-4">
          <label class="block">Time</label>
          <input type="time" id="appointmentTime" class="p-2 border rounded w-full" required>
        </div>
        <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded">Add Appointment</button>
      </form>
    </div>
  `;

  document.getElementById('addAppointmentBtn').addEventListener('click', function() {
    document.getElementById('addAppointmentForm').classList.remove('hidden');
  });

  document.getElementById('appointmentForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const patientName = document.getElementById('patientName').value;
    const doctorName = document.getElementById('doctorName').value;
    const appointmentDate = document.getElementById('appointmentDate').value;
    const appointmentTime = document.getElementById('appointmentTime').value;

    addAppointment({ patientName, doctorName, date: appointmentDate, time: appointmentTime });

    document.getElementById('appointmentForm').reset();
    document.getElementById('addAppointmentForm').classList.add('hidden');
  });

  function addAppointment(appointment) {
    const appointmentList = document.getElementById('appointmentList');

    const row = document.createElement('tr');
    row.classList.add('border-b');
    row.innerHTML = `
      <td class="px-4 py-2">${appointment.patientName}</td>
      <td class="px-4 py-2">${appointment.doctorName}</td>
      <td class="px-4 py-2">${appointment.date}</td>
      <td class="px-4 py-2">${appointment.time}</td>
      <td class="px-4 py-2">
        <button class="bg-yellow-500 text-white py-1 px-2 rounded editAppointmentBtn" data-id="${appointment.patientName}">Edit</button>
      </td>
    `;
    appointmentList.appendChild(row);

    const editBtns = document.querySelectorAll('.editAppointmentBtn');
    editBtns.forEach((btn) => {
      btn.addEventListener('click', function() {
        const patientName = btn.dataset.id;
        showEditAppointmentForm(patientName);
      });
    });
  }

  function showEditAppointmentForm(patientName) {
    contentDiv.innerHTML = `
      <h3 class="text-xl font-bold mb-4">Edit Appointment</h3>
      <form id="editAppointmentForm">
        <div class="mb-4">
          <label class="block">Patient Name</label>
          <input type="text" id="editPatientName" class="p-2 border rounded w-full" value="${patientName}" required>
        </div>
        <div class="mb-4">
          <label class="block">Doctor Name</label>
          <input type="text" id="editDoctorName" class="p-2 border rounded w-full" required>
        </div>
        <div class="mb-4">
          <label class="block">Date</label>
          <input type="date" id="editAppointmentDate" class="p-2 border rounded w-full" required>
        </div>
        <div class="mb-4">
          <label class="block">Time</label>
          <input type="time" id="editAppointmentTime" class="p-2 border rounded w-full" required>
        </div>
        <button type="submit" class="bg-yellow-500 text-white py-2 px-4 rounded">Save Changes</button>
      </form>
    `;

    document.getElementById('editAppointmentForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const newPatientName = document.getElementById('editPatientName').value;
      const newDoctorName = document.getElementById('editDoctorName').value;
      const newDate = document.getElementById('editAppointmentDate').value;
      const newTime = document.getElementById('editAppointmentTime').value;

      console.log('Updating appointment:', { newPatientName, newDoctorName, newDate, newTime });

      contentDiv.innerHTML = `
        <h3 class="text-xl font-bold mb-4">Appointments</h3>
        <p>Details of upcoming appointments.</p>
        <button id="addAppointmentBtn" class="bg-blue-500 text-white py-2 px-4 rounded mt-4">Add Appointment</button>
        <table id="appointmentTable" class="min-w-full mt-4">
          <thead>
            <tr class="border-b">
              <th class="px-4 py-2">Patient Name</th>
              <th class="px-4 py-2">Doctor Name</th>
              <th class="px-4 py-2">Date</th>
              <th class="px-4 py-2">Time</th>
              <th class="px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="appointmentList"></tbody>
        </table>
      `;
    });
  }
  break;

// Medicines Section
case 'medicines':
  contentDiv.innerHTML = `
    <h3 class="text-xl font-bold mb-4">Medicines</h3>
    <p>List of medicines available in the hospital.</p>
    <button id="addMedicineBtn" class="bg-blue-500 text-white py-2 px-4 rounded mt-4">Add Medicine</button>

    <table id="medicineTable" class="min-w-full mt-4">
      <thead>
        <tr class="border-b">
          <th class="px-4 py-2">Medicine Name</th>
          <th class="px-4 py-2">Quantity</th>
          <th class="px-4 py-2">Price</th>
          <th class="px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="medicineList">
        <!-- Medicine list will be dynamically populated here -->
      </tbody>
    </table>

    <div id="addMedicineForm" class="hidden mt-4">
      <h3 class="text-xl font-bold mb-4">Add New Medicine</h3>
      <form id="medicineForm">
        <div class="mb-4">
          <label class="block">Medicine Name</label>
          <input type="text" id="medicineName" class="p-2 border rounded w-full" placeholder="Enter medicine name" required>
        </div>
        <div class="mb-4">
          <label class="block">Quantity</label>
          <input type="number" id="medicineQuantity" class="p-2 border rounded w-full" placeholder="Enter quantity" required>
        </div>
        <div class="mb-4">
          <label class="block">Price</label>
          <input type="number" id="medicinePrice" class="p-2 border rounded w-full" placeholder="Enter price" required>
        </div>
        <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded">Add Medicine</button>
      </form>
    </div>
  `;

  document.getElementById('addMedicineBtn').addEventListener('click', function() {
    document.getElementById('addMedicineForm').classList.remove('hidden');
  });

  document.getElementById('medicineForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const medicineName = document.getElementById('medicineName').value;
    const quantity = document.getElementById('medicineQuantity').value;
    const price = document.getElementById('medicinePrice').value;

    addMedicine({ medicineName, quantity, price });

    document.getElementById('medicineForm').reset();
    document.getElementById('addMedicineForm').classList.add('hidden');
  });

  function addMedicine(medicine) {
    const medicineList = document.getElementById('medicineList');

    const row = document.createElement('tr');
    row.classList.add('border-b');
    row.innerHTML = `
      <td class="px-4 py-2">${medicine.medicineName}</td>
      <td class="px-4 py-2">${medicine.quantity}</td>
