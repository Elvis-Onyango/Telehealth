{% extends "basepages/base.html" %}
{% load static %}
{% load static tailwind_tags %}

{% block content %}
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Header with decorative element -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center">
      <h1 class="text-3xl font-bold text-white">Welcome Back</h1>
      <p class="text-blue-100 mt-2">Sign in to your account</p>
    </div>

    <div class="p-8">
      <form method="post" action="{% url 'users:login' %}" id="login-form" class="space-y-6">
        {% csrf_token %}
        
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-user text-gray-400"></i>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
              placeholder="Enter your username">
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
              placeholder="Enter your password">
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <i class="fas fa-eye-slash text-gray-400 hover:text-gray-600"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submit-btn"
          class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          <span id="btn-text">Sign in</span>
          <span id="spinner" class="ml-2 hidden">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
        </button>
      </form>

      <!-- Social Login -->
      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">Or continue with</span>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-3">
          <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
            <i class="fab fa-google text-red-500 mr-2"></i> Google
          </a>
          <a href="#" class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
            <i class="fab fa-facebook text-blue-600 mr-2"></i> Facebook
          </a>
        </div>
      </div>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account? 
          <a href="{% url 'users:register-page' %}" class="font-medium text-blue-600 hover:text-blue-500">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
  // Toggle password visibility
  const togglePassword = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  
  togglePassword.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.innerHTML = type === 'password' ? '<i class="fas fa-eye-slash text-gray-400 hover:text-gray-600"></i>' : 
                                          '<i class="fas fa-eye text-gray-400 hover:text-gray-600"></i>';
  });

  // Form submission
  const loginForm = document.getElementById('login-form');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // Show loading state
    submitBtn.disabled = true;
    btnText.textContent = 'Signing in...';
    spinner.classList.remove('hidden');

    const baseUrl = window.location.origin;

    function getCSRFToken() {
      const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
      return cookie ? cookie.split('=')[1] : '';
    }

    const formData = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      remember_me: document.getElementById('remember-me').checked
    };

    try {
      const response = await fetch(`${baseUrl}/api/users/login/`, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Login failed. Please check your credentials.');
      }

      if (!data.access || !data.refresh || !data.role) {
        throw new Error('Invalid response from server');
      }

      // Store tokens and user data
      localStorage.setItem('access_token', data.access);
      localStorage.setItem('refresh_token', data.refresh);
      localStorage.setItem('user_role', data.role);
      localStorage.setItem('username', formData.username);

      // Handle redirect based on role
      const roleRedirects = {
        "admin": "api/appointments/hospital-dashboard/",
        "doctor": data.profile_required ? "api/users/doctor-profile-create/" : "api/users/dashboard/",
        "patient": data.profile_required ? "api/users/patient-profile-create/" : "api/users/patient-dashboard/",
      };

      const redirectUrl = roleRedirects[data.role];
      if (!redirectUrl) {
        throw new Error(`Unknown role: ${data.role}`);
      }

      window.location.href = `${baseUrl}/${redirectUrl}`;

    } catch (error) {
      console.error('Login error:', error);
      
      // Show error message
      const errorDiv = document.createElement('div');
      errorDiv.className = 'mt-4 p-3 bg-red-50 text-red-600 rounded-lg text-center';
      errorDiv.innerHTML = `
        <i class="fas fa-exclamation-circle mr-2"></i>
        ${error.message || 'An error occurred during login. Please try again.'}
      `;
      
      // Remove any existing error messages
      const existingError = document.querySelector('.login-error');
      if (existingError) existingError.remove();
      
      errorDiv.classList.add('login-error');
      loginForm.appendChild(errorDiv);
      
      // Reset button state
      submitBtn.disabled = false;
      btnText.textContent = 'Sign in';
      spinner.classList.add('hidden');
    }
  });
});
  </script>
</body>
{% endblock %}
