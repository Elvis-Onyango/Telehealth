{% extends 'basepages/base.html' %}
{% load static %}
{% block content %}

<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-lg shadow-2xl w-full max-w-md transform transition-all duration-500 hover:scale-105">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-4 animate-fade-in-down">Patient Profile</h2>

        <form action="/api/patients/create/" method="POST" enctype="multipart/form-data" class="space-y-4">
            
            <!-- Profile Picture -->
            <div class="animate-fade-in-up delay-100">
                <label class="block font-medium text-gray-700 mb-2 text-center">Profile Picture</label>
                <div class="flex items-center justify-center">
                    <label class="flex flex-col items-center p-4 bg-gray-100 rounded-full cursor-pointer hover:bg-gray-200 transition duration-300">
                        <svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span class="mt-2 text-sm text-gray-600">Upload Photo</span>
                        <input type="file" name="profile_picture" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Date of Birth -->
            <div class="animate-fade-in-up delay-200">
                <label class="block font-medium text-gray-700 mb-1">Date of Birth</label>
                <input type="date" name="date_of_birth" required class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition duration-300">
            </div>

            <!-- Gender -->
            <div class="animate-fade-in-up delay-300">
                <label class="block font-medium text-gray-700 mb-1">Gender</label>
                <div class="flex space-x-4">
                    <label class="flex items-center">
                        <input type="radio" name="gender" value="male" class="text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2">Male</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="gender" value="female" class="text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2">Female</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="gender" value="other" class="text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2">Other</span>
                    </label>
                </div>
            </div>

            <!-- Blood Type -->
            <div class="animate-fade-in-up delay-400">
                <label class="block font-medium text-gray-700 mb-1">Blood Type</label>
                <select name="blood_type" required class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition duration-300">
                    <option value="">Select Blood Type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Emergency Contact Name -->
            <div class="animate-fade-in-up delay-500">
                <label class="block font-medium text-gray-700 mb-1">Emergency Contact Name</label>
                <input type="text" name="emergency_contact_name" required placeholder="Full Name" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition duration-300">
            </div>

            <!-- Emergency Contact Phone -->
            <div class="animate-fade-in-up delay-600">
                <label class="block font-medium text-gray-700 mb-1">Emergency Contact Phone</label>
                <input type="tel" name="emergency_contact_phone" required placeholder="Phone Number" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 transition duration-300">
            </div>

            <!-- Submit Button -->
            <div class="animate-fade-in-up delay-700">
                <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-indigo-700 focus:ring focus:ring-indigo-300 transition duration-300 transform hover:scale-105">
                    Save Profile
                </button>
            </div>
        </form>
    </div>

    <!-- Tailwind CSS Animations -->
    <style>
        @keyframes fade-in-down {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-down {
            animation: fade-in-down 0.5s ease-out;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .delay-500 {
            animation-delay: 0.5s;
        }

        .delay-600 {
            animation-delay: 0.6s;
        }

        .delay-700 {
            animation-delay: 0.7s;
        }
    </style>
    <script src="{% static 'js/patient_form.js' %}"></script>
</body>

{% endblock %}
