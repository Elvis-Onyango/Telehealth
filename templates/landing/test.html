<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiDoctor - Virtual Healthcare{% endblock %}</title>

</head>
<body class="font-sans bg-gray-50 flex flex-col min-h-screen">
<h1 class="center">api testing </h1>
<div id = 'content'>
    
</div>
    <!-- Scripts -->
    <script>
  document.addEventListener("DOMContentLoaded", function () {
    const token = localStorage.getItem("access_token");
    
    const baseUrl = window.location.origin;
    async function getPatientDoctor(){
        try {
            const response = await fetch(`${baseUrl}/api/users/patient/doctor/`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });
             if (!response.ok) throw new Error("Failed to fetch doctor profile");

            const data = await response.json();
            document.getElementById("content").innerHTML = data;
            
            console.log("Patient Doctor:", data);

       
           }
        catch (error) {
            console.error("Error fetching doctor profile:", error);
        };
        
     };
     getPatientDoctor();
 });
    </script>
    
</body>
</html>
